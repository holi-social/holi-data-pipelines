default:
  before_script:
    - set -ex
    # env -0 | sort -z | tr '\0' '\n': Sort env output alphabetically, keeping multiline variables intact
    # egrep: Remove sensitive information from the output of env
    - env -0 | sort -z | tr '\0' '\n' | egrep -ve '^(DOCKER_AUTH_CONFIG|GOOGLE_APPLICATION_CREDENTIALS)=.*'
  interruptible: true
  tags:
    - 1cpu-4gb

variables:
  PREFECT_SERVER_URL_PATH: "$CI_PROJECT_DIR/prefect_server_url"

.pip_cache_rw:
  key:
    files:
      - requirements.txt
      - dev-requirements.txt
  policy: pull-push
  paths:
    - .cache/pip
    - venv/

.pip_cache_readonly:
  key:
    files:
      - requirements.txt
      - dev-requirements.txt
  policy: pull
  paths:
    - .cache/pip
    - venv/

.terraform_deploy:
  image:
    name: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/hashicorp/terraform:1.9.8"
    entrypoint: ["/bin/sh", "-c"]
  stage: "deploy"
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_SLUG
  artifacts:
    paths:
      - "terraform/environments/crash.log"
      - "terraform/environments/terraform-*.log"
      - $PREFECT_SERVER_URL_PATH
    name: "${CI_JOB_NAME}_${CI_JOB_ID}"
    expire_in: 1 month
  script:
    - terraform/environments/scripts/create-or-update-env.sh $ENVIRONMENT_ID $CI_COMMIT_SHA
    - terraform/environments/scripts/get-output.sh prefect_server_url > $PREFECT_SERVER_URL_PATH
  resource_group: $ENVIRONMENT_ID
  interruptible: false

.prefect_deploy:
  image:
    name: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/prefecthq/prefect:3.1.4-python3.12"
  stage: "deploy"
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_SLUG
  cache: !reference [.pip_cache_readonly]
  script:
    - source venv/bin/activate
    - PREFECT_API_URL="$(cat $PREFECT_SERVER_URL_PATH)/api" prefect deploy --all
  resource_group: $ENVIRONMENT_ID

.smoketest:
  image: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/prefecthq/prefect:3.1.4-python3.12"
  stage: ".post"
  cache: !reference [.pip_cache_readonly]
  script:
    - source venv/bin/activate
    - PREFECT_API_URL="$(cat $PREFECT_SERVER_URL_PATH)/api" prefect shell watch "echo smoketesting"
    - PREFECT_API_URL="$(cat $PREFECT_SERVER_URL_PATH)/api" prefect deployment run hello-universe/example-deploy --watch
    # TODO should/could we roll back the service to the last working revision on test failure?

install_dependencies:
  image: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/python:3.12-slim"
  stage: ".pre"
  cache: !reference [.pip_cache_rw]
  script:
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt --exists-action s
    - pip install -r dev-requirements.txt --exists-action s
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - requirements.txt
        - dev-requirements.txt
        - .gitlab-ci.yml

validate:
  image: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/python:3.12-slim"
  stage: "test"
  needs:
    - job: install_dependencies
      optional: true
  cache: !reference [.pip_cache_readonly]
  script:
    - source venv/bin/activate
    - mypy src
    - pytest .

## staging environment
terraform_deploy_staging:
  extends: .terraform_deploy
  needs: ["validate"]
  variables:
    ENVIRONMENT_ID: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      when: on_success

prefect_deploy_staging:
  extends: .prefect_deploy
  needs: ["terraform_deploy_staging"]
  variables:
    ENVIRONMENT_ID: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      when: on_success

smoketest_staging:
  extends: .smoketest
  needs: ["prefect_deploy_staging"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      when: on_success

## production environment
terraform_deploy_production:
  extends: .terraform_deploy
  needs: ["validate"]
  variables:
    ENVIRONMENT_ID: production
  rules:
    - if: $CI_COMMIT_BRANCH == "production" && $CI_PIPELINE_SOURCE == "push"
      when: on_success

prefect_deploy_production:
  extends: .prefect_deploy
  needs: ["terraform_deploy_production"]
  variables:
    ENVIRONMENT_ID: production
  rules:
    - if: $CI_COMMIT_BRANCH == "production" && $CI_PIPELINE_SOURCE == "push"
      when: on_success

smoketest_production:
  extends: .smoketest
  needs: ["prefect_deploy_production"]
  rules:
    - if: $CI_COMMIT_BRANCH == "production" && $CI_PIPELINE_SOURCE == "push"
      when: on_success
