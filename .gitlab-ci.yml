default:
  before_script:
    - set -e
    # env -0 | sort -z | tr '\0' '\n': Sort env output alphabetically, keeping multiline variables intact
    # egrep: Remove sensitive information from the output of env
    #- env -0 | sort -z | tr '\0' '\n' | egrep -ve '^(DOCKER_AUTH_CONFIG|GOOGLE_APPLICATION_CREDENTIALS)=.*'
  interruptible: true
  tags:
    - 1cpu-4gb

variables:
  PREFECT_SERVER_URL_PATH: "$CI_PROJECT_DIR/prefect_server_url"

.pip_cache_rw:
  key:
    files:
      - requirements.txt
      - dev-requirements.txt
  policy: pull-push
  paths:
    - .cache/pip
    - venv/

.pip_cache_readonly:
  key:
    files:
      - requirements.txt
      - dev-requirements.txt
  policy: pull
  paths:
    - .cache/pip
    - venv/

stages:
  - "prepare"
  - "build"
  - "test"
  - "deploy"

.rule_templates:
  only_main:
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_PIPELINE_SOURCE == "push"
      when: on_success
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_PIPELINE_SOURCE == "web"
      when: on_success
  only_production:
    - if: $CI_COMMIT_BRANCH == 'production' && $CI_PIPELINE_SOURCE == "push"
      when: on_success
    - if: $CI_COMMIT_BRANCH == 'production' && $CI_PIPELINE_SOURCE == "web"
      when: on_success

.terraform_deploy:
  image:
    name: "europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/terraform-docker"
  stage: build
  services:
    - name: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:28-dind"
      alias: "docker"
  stage: "deploy"
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_SLUG
  artifacts:
    paths:
      - "terraform/environments/crash.log"
      - "terraform/environments/terraform-*.log"
      - $PREFECT_SERVER_URL_PATH
    name: "${CI_JOB_NAME}_${CI_JOB_ID}"
    expire_in: 1 month
  script:
    - terraform/environments/scripts/create-or-update-env.sh $ENVIRONMENT_ID $CI_COMMIT_SHA
    - terraform/environments/scripts/get-output.sh prefect_server_url > $PREFECT_SERVER_URL_PATH
  resource_group: $ENVIRONMENT_ID
  interruptible: false

.prefect_deploy:
  image: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/prefecthq/prefect:3.2.11-python3.12"
  stage: "deploy"
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_SLUG
  cache: !reference [ .pip_cache_readonly ]
  script:
    - source venv/bin/activate
    - PREFECT_API_URL="$(cat $PREFECT_SERVER_URL_PATH)/api" PYTHONPATH=$PYTHONPATH:. python src/pipelines/deployments.py
  resource_group: $ENVIRONMENT_ID

.smoketest:
  image: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/prefecthq/prefect:3.2.11-python3.12"
  stage: "deploy"
  cache: !reference [ .pip_cache_readonly ]
  script:
    - source venv/bin/activate
    - PREFECT_API_URL="$(cat $PREFECT_SERVER_URL_PATH)/api" prefect shell watch --flow-run-name ci-test-$CI_PIPELINE_IID --tag ci-test "echo smoketesting"
    - PREFECT_API_URL="$(cat $PREFECT_SERVER_URL_PATH)/api" prefect deployment run --tag ci-test --watch hello-universe/hello-universe

.build_prefect_flow_docker_image:
  image: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:28"
  stage: "build"
  services:
    - name: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:28-dind"
      alias: "docker"
  variables:
    # this could be fetched via terraform output ("gcr_location" in infra project), but then we would need an extra job for terraform
    GCR_IMAGE_PREFIX: europe-north1-docker.pkg.dev/holi-shared/docker/data-pipeline-job
    ENVIRONMENT_SUFFIX: staging
  script:
    - GCR_IMAGE=${GCR_IMAGE_PREFIX}-${ENVIRONMENT_SUFFIX}
    - docker pull "$GCR_IMAGE" || true # Allows us to use --cache-from, we need to tag with latest in the next command for this to work
    - docker build --cache-from "$GCR_IMAGE" -t "$GCR_IMAGE":latest -t "$GCR_IMAGE":"$CI_COMMIT_SHA" .
    - docker push "$GCR_IMAGE":"$CI_COMMIT_SHA" # we use latest in prefect, this is just extra information for humans.
    - docker push "$GCR_IMAGE":latest # for caching the build and for use by prefect pipelines

install_dependencies:
  image: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/python:3.12-slim"
  stage: "prepare"
  cache: !reference [ .pip_cache_rw ]
  script:
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt --exists-action s
    - pip install -r dev-requirements.txt --exists-action s
  rules:
    # always run when triggered manually
    - if: $CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "web"
      when: on_success
    # only run on specific file changes when triggered by git push
    - if: $CI_COMMIT_BRANCH
      changes:
        - requirements.txt
        - dev-requirements.txt
        - .gitlab-ci.yml

validate:
  image: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/python:3.12-slim"
  stage: "prepare"
  needs:
    - job: install_dependencies
      optional: true
  cache: !reference [ .pip_cache_readonly ]
  script:
    - source venv/bin/activate
    - ruff check
    - ruff format --check
    - mypy --python-executable=venv/bin/python src
    - pytest .

build_prefect_flow_docker_image_staging:
  extends: .build_prefect_flow_docker_image
  needs: [ "validate" ]
  variables:
    ENVIRONMENT_SUFFIX: staging
  rules:
    # always run when triggered manually
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"
      when: on_success
    # only run on specific file changes when triggered by git push
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - requirements.txt
        - src/**/*
        - .gitlab-ci.yml

## staging environment
terraform_deploy_staging:
  extends: .terraform_deploy
  needs: [ "validate" ]
  variables:
    ENVIRONMENT_ID: staging
  rules:
    - !reference [ .rule_templates, only_main ]

prefect_deploy_staging:
  extends: .prefect_deploy
  needs:
    - job: "terraform_deploy_staging"
    - job: "build_prefect_flow_docker_image_staging"
      optional: true
  variables:
    ENVIRONMENT_ID: staging
  rules:
    - !reference [ .rule_templates, only_main ]

smoketest_staging:
  extends: .smoketest
  needs: [ "terraform_deploy_staging", "prefect_deploy_staging" ]
  rules:
    - !reference [ .rule_templates, only_main ]

## production environment
build_prefect_flow_docker_image_production:
  extends: .build_prefect_flow_docker_image
  needs: [ "validate" ]
  stage: deploy
  variables:
    ENVIRONMENT_SUFFIX: production
  rules:
    # always run when triggered manually
    - if: $CI_COMMIT_BRANCH == "production" && $CI_PIPELINE_SOURCE == "web"
      when: on_success
    # only run on specific file changes when triggered by git push
    - if: $CI_COMMIT_BRANCH == "production" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - requirements.txt
        - src/**/*
        - .gitlab-ci.yml

terraform_deploy_production:
  extends: .terraform_deploy
  needs: [ "validate" ]
  stage: deploy
  variables:
    ENVIRONMENT_ID: production
  rules:
    - !reference [ .rule_templates, only_production ]

prefect_deploy_production:
  extends: .prefect_deploy
  needs:
    - job: "terraform_deploy_production"
    - job: "build_prefect_flow_docker_image_production"
      optional: true
  stage: deploy
  variables:
    ENVIRONMENT_ID: production
  rules:
    - !reference [ .rule_templates, only_production ]

smoketest_production:
  extends: .smoketest
  needs: [ "terraform_deploy_production", "prefect_deploy_production" ]
  stage: deploy
  rules:
    - !reference [ .rule_templates, only_production ]
