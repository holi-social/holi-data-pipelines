default:
  before_script:
    - set -e
    # DANGER don't use `set -x` or print the environment via e.g. `env` in pipeline runs, this might leak credentials (has leaked them)
  interruptible: true
  tags:
    - 1cpu-4gb

variables:
  PREFECT_SERVER_URL_PATH: "$CI_PROJECT_DIR/prefect_server_url"
  UV_INDEX_URL: "https://europe-north1-python.pkg.dev/holi-shared/pypi-remote/simple/"
  PIP_INDEX_URL: "https://europe-north1-python.pkg.dev/holi-shared/pypi-remote/simple/"
  PIP_TRUSTED_HOST: "europe-north1-python.pkg.dev"

.uv_cache_rw_pipelines:
  policy: pull-push
  key:
    files:
      - "uv.lock"
  paths:
    - .uv-cache

.uv_cache_ro_pipelines:
  key:
    files:
      - "uv.lock"
  policy: pull
  paths:
    - .uv-cache

.rule_templates:
  only_pipelines:
    - if: $CI_PIPELINE_SOURCE == 'push'
      changes:
        - "**/*"
        - "!pubsub_typesense_updater/**/*"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'web'
      changes:
        - "**/*"
        - "!pubsub_typesense_updater/**/*"
      when: on_success
  only_pipelines_main:
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_PIPELINE_SOURCE == 'push'
      changes:
        - "**/*"
        - "!pubsub_typesense_updater/**/*"
      when: on_success
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_PIPELINE_SOURCE == 'web'
      changes:
        - "**/*"
        - "!pubsub_typesense_updater/**/*"
      when: on_success
  only_pipelines_production:
    - if: $CI_COMMIT_BRANCH == 'production' && $CI_PIPELINE_SOURCE == 'push'
      changes:
        - "**/*"
        - "!pubsub_typesense_updater/**/*"
      when: on_success
    - if: $CI_COMMIT_BRANCH == 'production' && $CI_PIPELINE_SOURCE == 'web'
      changes:
        - "**/*"
        - "!pubsub_typesense_updater/**/*"
      when: on_success
  only_pubsub_typesense_updater:
    - if: $CI_PIPELINE_SOURCE == 'push'
      changes:
        - uv.lock
        - pyproject.toml
        - shared/**/*
        - pubsub_typesense_updater/**/*
        - .gitlab-ci.yml
      when: on_success

pubsub_typesense_updater_validate:
  image: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/python:3.13-slim"
  before_script:
    - apt-get update -qq
    - apt-get install -y build-essential
    - pip install --root-user-action ignore --disable-pip-version-check uv
  script:
    - uv run --package pubsub_typesense_updater pytest shared pubsub_typesense_updater
    - uv run --package pubsub_typesense_updater ruff check shared pubsub_typesense_updater
    - uv run --package pubsub_typesense_updater ruff format --check shared pubsub_typesense_updater
    - uv export --package pubsub_typesense_updater > pubsub_typesense_updater/requirements.txt
  artifacts:
    paths:
      - 'pubsub_typesense_updater/requirements.txt' # needed in .pubsub_typesense_updater_deploy which runs without uv
  rules:
    - !reference [ .rule_templates, only_pubsub_typesense_updater ]
  interruptible: true

.pubsub_typesense_updater_deploy:
  needs:
    - job: pubsub_typesense_updater_validate
  image:
    name: "europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/terraform-docker"
  services:
    - name: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:29-dind"
      alias: "docker"
  resource_group: $ENVIRONMENT_ID
  artifacts:
    paths:
      - 'terraform/environments/crash.log' # optional, only available in case of a crash/panic
      - 'terraform/environments/terraform-*.log' # separate log for every step/command
    name: '${CI_JOB_NAME}_${CI_JOB_ID}'
    #when: on_failure # can't do that for api base url, but can't define multiple artifacts
    expire_in: 1 week
  variables:
    FUNCTION_NAME: pubsub_typesense_updater
  before_script:
    - apk add zip
  script:
    # Create a deployment directory with all required files
    - cd pubsub_typesense_updater
    - mkdir -p .build
    - cp -r ../shared/ .build/shared/
    - cp -r *.py requirements.txt .build/
    - cd .build
    - zip -r ${CI_COMMIT_SHA}_pubsub_typesense_updater.zip .
    - cd ..
    - terraform/environments/scripts/create-or-update-env.sh "$ENVIRONMENT_ID" "../../.build/${CI_COMMIT_SHA}_pubsub_typesense_updater.zip"
  interruptible: false

pubsub_typesense_updater_staging_deploy:
  extends: .pubsub_typesense_updater_deploy
  variables:
    ENVIRONMENT_ID: 'staging'
  rules:
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_PIPELINE_SOURCE == 'web'
      when: on_success
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_PIPELINE_SOURCE == 'push'
      when: on_success
      changes:
        - uv.lock
        - pyproject.toml
        - shared/**/*
        - pubsub_typesense_updater/**/*
        - .gitlab-ci.yml

pubsub_typesense_updater_production_deploy:
  extends: .pubsub_typesense_updater_deploy
  variables:
    ENVIRONMENT_ID: 'production'
  rules:
    - if: $CI_COMMIT_BRANCH == 'production' && $CI_PIPELINE_SOURCE == 'web'
      when: on_success
    - if: $CI_COMMIT_BRANCH == 'production' && $CI_PIPELINE_SOURCE == 'push'
      when: on_success
      changes:
        - uv.lock
        - pyproject.toml
        - shared/**/*
        - pubsub_typesense_updater/**/*
        - .gitlab-ci.yml

.terraform_deploy:
  image:
    name: "europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/terraform-docker"
  services:
    - name: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:29-dind"
      alias: "docker"
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_SLUG
  artifacts:
    paths:
      - "terraform/environments/crash.log"
      - "terraform/environments/terraform-*.log"
      - $PREFECT_SERVER_URL_PATH
    name: "${CI_JOB_NAME}_${CI_JOB_ID}"
    expire_in: 1 month
  script:
    - terraform/environments/scripts/create-or-update-env.sh $ENVIRONMENT_ID $CI_COMMIT_SHA
    - terraform/environments/scripts/get-output.sh prefect_server_url > $PREFECT_SERVER_URL_PATH
  resource_group: $ENVIRONMENT_ID
  interruptible: false

.prefect_deploy:
  image: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/prefecthq/prefect:3.6.5-python3.13"
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_SLUG
  cache: !reference [ .uv_cache_ro_pipelines ]
  before_script:
    - pip install --root-user-action ignore --disable-pip-version-check uv
    - uv sync --locked --link-mode=copy --package src
  script:
    - export PREFECT_API_URL="$(cat $PREFECT_SERVER_URL_PATH)/api"
    - uv run --package src python -m src.pipelines.deployments
  resource_group: $ENVIRONMENT_ID

.smoketest:
  image: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/prefecthq/prefect:3.6.5-python3.13"
  cache: !reference [ .uv_cache_ro_pipelines ]
  before_script:
    - pip install --root-user-action ignore --disable-pip-version-check uv
    - uv sync --locked --link-mode=copy --package src
  script:
    - export PREFECT_API_URL="$(cat $PREFECT_SERVER_URL_PATH)/api"
    - prefect shell watch --flow-run-name ci-test-$CI_PIPELINE_IID --tag ci-test "echo smoketesting"
    - prefect deployment run --tag ci-test --watch hello-universe/hello-universe

.build_prefect_flow_docker_image:
  image: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:29"
  services:
    - name: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:29-dind"
      alias: "docker"
  variables:
    # this could be fetched via terraform output ("gcr_location" in infra project), but then we would need an extra job for terraform
    GCR_IMAGE_PREFIX: europe-north1-docker.pkg.dev/holi-shared/docker/data-pipeline-job
    ENVIRONMENT_SUFFIX: staging
  script:
    - pwd
    - ls -la
    - GCR_IMAGE=${GCR_IMAGE_PREFIX}-${ENVIRONMENT_SUFFIX}
    - docker pull "$GCR_IMAGE" || true # Allows us to use --cache-from, we need to tag with latest in the next command for this to work
    - docker build --cache-from "$GCR_IMAGE" -t "$GCR_IMAGE":latest -t "$GCR_IMAGE":"$CI_COMMIT_SHA" .
    - docker push "$GCR_IMAGE":"$CI_COMMIT_SHA" # we use latest in prefect, this is just extra information for humans.
    - docker push "$GCR_IMAGE":latest # for caching the build and for use by prefect pipelines

pipelines_validate:
  image: "europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/python:3.13-slim"
  cache: !reference [ .uv_cache_rw_pipelines ]
  before_script:
    - pip install --root-user-action ignore --disable-pip-version-check uv
    - uv sync --locked --link-mode=copy --package src
  script:
    - uv run --exact --package src ruff check shared src
    - uv run --exact --package src ruff format --check shared src
    - uv run --exact --package src mypy shared src
    - uv run --exact --package src pytest src
    # remove pre-built wheels from cache, keep source-built wheels (see https://docs.astral.sh/uv/concepts/cache/#caching-in-continuous-integration)
    - uv cache prune --ci
  rules:
    - !reference [ .rule_templates, only_pipelines ]

build_prefect_flow_docker_image_staging:
  extends: .build_prefect_flow_docker_image
  needs:
    - job: pipelines_validate
  variables:
    ENVIRONMENT_SUFFIX: staging
  rules:
    # always run when triggered manually
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_PIPELINE_SOURCE == 'web'
      when: on_success
    # only run on specific file changes when triggered by git push
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_PIPELINE_SOURCE == 'push'
      changes:
        - uv.lock
        - pyproject.toml
        - shared/**/*
        - src/**/*
        - .gitlab-ci.yml

## staging environment
pipelines_tf_deploy_staging:
  extends: .terraform_deploy
  needs:
    - job: pipelines_validate
  variables:
    ENVIRONMENT_ID: staging
  rules:
    - !reference [ .rule_templates, only_pipelines_main ]

prefect_deploy_staging:
  extends: .prefect_deploy
  needs:
    - job: pipelines_tf_deploy_staging
    - job: build_prefect_flow_docker_image_staging
      optional: true
  variables:
    ENVIRONMENT_ID: staging
  rules:
    - !reference [ .rule_templates, only_pipelines_main ]

prefect_smoketest_staging:
  extends: .smoketest
  needs:
    - job: pipelines_tf_deploy_staging
    - job: prefect_deploy_staging
  rules:
    - !reference [ .rule_templates, only_pipelines_main ]

## production environment
build_prefect_flow_docker_image_production:
  extends: .build_prefect_flow_docker_image
  needs:
    - job: pipelines_validate
  variables:
    ENVIRONMENT_SUFFIX: production
  rules:
    # always run when triggered manually
    - if: $CI_COMMIT_BRANCH == 'production' && $CI_PIPELINE_SOURCE == 'web'
      when: on_success
    # only run on specific file changes when triggered by git push
    - if: $CI_COMMIT_BRANCH == 'production' && $CI_PIPELINE_SOURCE == 'push'
      changes:
        - uv.lock
        - pyproject.toml
        - shared/**/*
        - src/**/*
        - .gitlab-ci.yml

pipelines_tf_deploy_production:
  extends: .terraform_deploy
  needs:
    - job: pipelines_validate
  variables:
    ENVIRONMENT_ID: production
  rules:
    - !reference [ .rule_templates, only_pipelines_production ]

prefect_deploy_production:
  extends: .prefect_deploy
  needs:
    - job: pipelines_tf_deploy_production
    - job: build_prefect_flow_docker_image_production
      optional: true
  variables:
    ENVIRONMENT_ID: production
  rules:
    - !reference [ .rule_templates, only_pipelines_production ]

pipelines_smoketest_production:
  extends: .smoketest
  needs:
    - job: pipelines_tf_deploy_production
    - job: prefect_deploy_production
  rules:
    - !reference [ .rule_templates, only_pipelines_production ]
