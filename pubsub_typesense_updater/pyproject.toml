tool.uv.package = false

[project]
name = "pubsub_typesense_updater"
version = "1.0.0"
description = "A Cloud Function consuming domain events received via Pub/Sub to keep Typesense search/reco index in sync"
readme = "README.md"
requires-python = ">=3.13.3"
dependencies = [
    "functions-framework==3.8.3",
    "google-cloud-logging==3.12.1",
    "shared",
    "pyfarmhash==0.4.0",
    "langchain-core>=0.3.74",
    "langchain>=0.3.27",
    "langchain-google-vertexai>=2.0.28",
]

[dependency-groups]
dev = [
    "faker==37.4.0",
    "pre-commit==4.2.0",
    "pydantic==2.11.7",
    "pytest==8.4.1",
    "ruff==0.12.1",
    "types-pyfarmhash==0.4.0.20240902",
]
