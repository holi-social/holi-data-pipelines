# Welcome to your prefect.yaml file! You can use this file for storing and managing
# configuration for deploying your flows. We recommend committing this file to source
# control along with your flow code.

# Generic metadata about this project
name: holi-data-pipelines

# build section allows you to manage and build docker images
build:
  - prefect.deployments.steps.run_shell_script:
      id: get_environment_docker_image
      # extract the prefect api url environment part
      script: sh scripts/get_prefect_environment.sh
      stream_output: false

# push section allows you to manage if and how this project is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning this project in remote locations
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/holi-data-pipelines

# the deployments section allows you to provide configuration for deploying flows
deployments:
  - name: example-deploy
    version:
    tags: []
    description:
    entrypoint: src/pipelines/example/pipeline.py:hello_universe
    schedules:
      - cron: 0 5 29 2 * 0 2020/10
        timezone:
        day_or: true
        active: true
    work_pool:
      name: cloud-run-v2
      work_queue_name: default
      job_variables:
        image: "{{ get_environment_docker_image.stdout }}"
        name: "example"
    concurrency_limit:
    parameters: {}
    enforce_parameter_schema: true
  - name: bq-to-typesense
    version:
    tags: []
    description: "Orchestrates the ETL pipeline to move data from BigQuery to Typesense."
    entrypoint: src/pipelines/bq_to_typesense/pipeline.py:volunteering_to_typesense_etl
    schedules:
      - cron: 30 6 * * * # run every day at 06:30 (classification job runs from 04:40 to ~ 06:00)
        timezone: "Europe/Berlin"
        day_or: true
        active: true
    work_pool:
      name: cloud-run-v2
      work_queue_name: default
      job_variables:
        image: "{{ get_environment_docker_image.stdout }}"
        memory: "4096Mi"
        timeout: 86400
        name: "srch-etl-volunteering"
    concurrency_limit:
    parameters: {}
    enforce_parameter_schema: true
