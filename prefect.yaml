# Welcome to your prefect.yaml file! You can use this file for storing and managing
# configuration for deploying your flows. We recommend committing this file to source
# control along with your flow code.

# Generic metadata about this project
name: holi-data-pipelines

# build section allows you to manage and build docker images
build:
  - prefect.deployments.steps.run_shell_script:
      id: get_prefect_environment
      # extract the prefect api url environment part
      script: sh scripts/get_prefect_environment.sh
      stream_output: false

# push section allows you to manage if and how this project is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning this project in remote locations
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/holi-data-pipelines

definitions:
  default_work_pool: &cloud_run_v2
    name: cloud-run-v2
    work_queue_name: default
  default_job_variables: &default_job_variables
    image: "europe-north1-docker.pkg.dev/holi-shared/docker/data-pipeline-job-{{ get_prefect_environment.stdout }}:latest"
    memory: '512Mi'
    timeout: 86400
  default_cron_schedule_values: &default_cron_schedule_values
    timezone: Europe/Berlin
    day_or: true
    active: true
  deactivated_cron_schedule: &deactivated_cron_schedule
    <<: *default_cron_schedule_values
    cron: 0 5 29 2 * 0 2020/10 # value is required, but since we set this schedule to inactive, the value is irrelevant
    active: false
  default_deployment_values: &default_deployment_values
    version:
    tags: [ ]
    description:
    schedules:
      - *deactivated_cron_schedule
    concurrency_limit: 1
    parameters: { }
    enforce_parameter_schema: true


# the deployments section allows you to provide configuration for deploying flows
deployments:
  - name: example-deploy
    <<: *default_deployment_values
    entrypoint: src/pipelines/example/pipeline.py:hello_universe
    work_pool:
      <<: *cloud_run_v2
      job_variables:
        <<: *default_job_variables
        name: "example"
  - name: all-to-typesense-from-scratch
    <<: *default_deployment_values
    description: "Orchestrates the ETL pipeline to ingest all data to Typesense."
    entrypoint: src/pipelines/all_to_typesense/ingest_from_scratch.py:all_to_typesense_ingest_from_scratch_flow
    work_pool:
      <<: *cloud_run_v2
      job_variables:
        <<: *default_job_variables
        memory: '4096Mi'
        name: "srch-etl-volunteering-scratch"
  - name: volunteering-to-typesense-updates-only
    <<: *default_deployment_values
    description: "Orchestrates the ETL pipeline to move volunteering updates from BigQuery to Typesense."
    entrypoint: src/pipelines/volunteering_to_typesense/ingest_updates.py:volunteering_to_typesense_ingest_updates_flow
    schedules:
      - <<: *default_cron_schedule_values
        cron: 30 6 * * * # run every day at 06:30 (classification job runs from 04:40 to ~ 06:00)
    work_pool:
      <<: *cloud_run_v2
      job_variables:
        <<: *default_job_variables
        memory: '4096Mi'
        name: "srch-etl-volunteering-updates"
  - name: profiles-to-typesense-from-scratch
    <<: *default_deployment_values
    description: "Ingests user profiles from Datastream-replicated Okuna into Typesense"
    entrypoint: src/pipelines/profiles_to_typesense/ingest_from_scratch.py:profiles_to_typesense_ingest_from_scratch_flow
    work_pool:
      <<: *cloud_run_v2
      job_variables:
        <<: *default_job_variables
        memory: '4096Mi'
        name: "srch-etl-profiles-scratch"
  - name: spaces-to-typesense-from-scratch
    <<: *default_deployment_values
    description: "Ingests spaces from Datastream-replicated Okuna into Typesense"
    entrypoint: src/pipelines/spaces_to_typesense/ingest_from_scratch.py:spaces_to_typesense_ingest_from_scratch_flow
    work_pool:
      <<: *cloud_run_v2
      job_variables:
        <<: *default_job_variables
        memory: '4096Mi'
        name: "srch-etl-spaces-scratch"
  - name: crawl-betterplace
    <<: *default_deployment_values
    description: "Crawls betterplace.org for charity projects and ingests them into BigQuery"
    entrypoint: src/pipelines/crawlers/betterplace/pipeline.py:crawl_betterplace
    work_pool:
      <<: *cloud_run_v2
      job_variables:
        <<: *default_job_variables
        memory: '1024Mi'
        name: "crawl-betterplace"
  - name: crawl-voltastics
    <<: *default_deployment_values
    description: "Crawls voltastics.com for volunteering opportunities and ingests them into BigQuery"
    entrypoint: src/pipelines/crawlers/voltastics/pipeline.py:crawl_voltastics
    schedules:
      - <<: *default_cron_schedule_values
        cron: 40 1 * * * # run every day at 01:40
        active: { { get_prefect_environment.stdout == "production" } }
    work_pool:
      <<: *cloud_run_v2
      job_variables:
        <<: *default_job_variables
        memory: '1024Mi'
        name: "crawl-voltastics"
