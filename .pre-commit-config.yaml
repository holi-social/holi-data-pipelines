repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff-lint
        language: system
        entry: ruff check
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff-format
        language: system
        entry: ruff format --check
        pass_filenames: false
        always_run: true
  - repo: git@gitlab-holi:app/holi-meta.git
    rev: 71898ea41a32935663e4f9041ccde6189b7edcaa
    hooks:
      - id: scan-comments
      - id: security-checks
      - id: gitleaks
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [
          --python-executable=.venv/bin/python,
        ]
