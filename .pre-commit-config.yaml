repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff check
        language: system
        entry: ruff check
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format --check
        language: system
        entry: ruff format --check
        pass_filenames: false
        always_run: true
      - id: gitleaks
        name: gitleaks
        language: system
        entry: gitleaks protect --staged -v -c ../.gitleaks.toml
        pass_filenames: false
        always_run: true
      - id: mypy_src_shared
        name: mypy src shared
        language: system
        entry: mypy --python-executable=.venv/bin/python src shared
        pass_filenames: false
        always_run: true
      - id: mypy_search_integration
        name: mypy search_integration
        language: system
        entry: cd cloud_functions/search_integration && mypy --python-executable=./.venv/bin/python --explicit-package-bases --namespace-packages .
        pass_filenames: false
        always_run: true
      - id: mypy_search_integration_shared
        name: mypy search_integration shared
        language: system
        entry: mypy --python-executable=cloud_functions/search_integration/.venv/bin/python shared
        pass_filenames: false
        always_run: true
