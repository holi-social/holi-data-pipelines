repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff check
        language: system
        entry: ruff check
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format --check
        language: system
        entry: ruff format --check
        pass_filenames: false
        always_run: true
      - id: gitleaks
        name: gitleaks
        language: system
        entry: gitleaks protect --staged -v -c ../.gitleaks.toml
        pass_filenames: false
        always_run: true
      - id: mypy_src_shared
        name: mypy src shared
        language: system
        entry: mypy --python-executable=.venv/bin/python src shared
        pass_filenames: false
        always_run: true
      - id: mypy_pubsub-typesense-index-updater
        name: mypy pubsub_typesense_index_updater
        language: system
        entry: cd pubsub_typesense_index_updater && mypy --python-executable=./.venv/bin/python --explicit-package-bases --namespace-packages .
        pass_filenames: false
        always_run: true
      - id: mypy_pubsub-typesense-index-updater_shared
        name: mypy pubsub_typesense_index_updater shared
        language: system
        entry: mypy --python-executable=pubsub_typesense_index_updater/.venv/bin/python shared
        pass_filenames: false
        always_run: true
