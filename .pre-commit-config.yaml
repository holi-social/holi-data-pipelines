repos:
  - repo: git@gitlab.holi.team:app/holi-meta.git
    rev: 345e2cab6704f708a946c08a9eaa1ba769c455fb
    hooks:
      - id: scan-comments
      - id: security-checks
      - id: gitleaks
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock check
        language: system
        entry: uv lock --check
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        language: system
        entry: uv run ruff check
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff-format
        language: system
        entry: uv run ruff format --check
        pass_filenames: false
        always_run: true
      - id: gitleaks
        name: gitleaks
        language: system
        entry: gitleaks protect --staged -v -c ../.gitleaks.toml
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy
        language: system
        entry: uv run --exact --package src mypy shared src
        pass_filenames: false
        always_run: true
