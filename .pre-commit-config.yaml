repos:
  - repo: git@gitlab.holi.team:app/holi-meta.git
    rev: 345e2cab6704f708a946c08a9eaa1ba769c455fb
    hooks:
      - id: scan-comments
      - id: security-checks
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff check
        language: system
        entry: ruff check
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format --check
        language: system
        entry: ruff format --check
        pass_filenames: false
        always_run: true
      - id: mypy_src_shared
        name: mypy src shared
        language: system
        entry: mypy --python-executable=.venv/bin/python src shared
        pass_filenames: false
        always_run: true
      - id: mypy_pubsub-typesense-updater_shared
        name: mypy pubsub_typesense_updater shared
        language: system
        entry: cd pubsub_typesense_updater && mypy --python-executable=./.venv/bin/python --explicit-package-bases --namespace-packages . ../shared
        pass_filenames: false
        always_run: true
 

 